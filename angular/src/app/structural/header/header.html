
<nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Main navigation">
    <div class="container-fluid">
        <a routerLink="/" class="d-flex mb-2 mb-lg-0 text-dark cursor-pointer text-decoration-none">
            <doc-logo [interactive]="true" class="fs-1 me-4 d-none d-sm-block"></doc-logo>
            <doc-logo [interactive]="true" class="fs-4 me-4 d-block d-sm-none"></doc-logo>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="nav navbar-nav">
                <li class="nav-item">
                    <a class="nav-link px-2 d-none" routerLink="/" routerLinkActive="active">
                        Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-2" routerLink="/blog" [class.active]="isBlogActive()" [attr.aria-current]="isBlogActive() ? 'page' : null">
                        Blog
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-2" routerLink="/heroes" routerLinkActive="active" #heroesLink="routerLinkActive" [attr.aria-current]="heroesLink.isActive ? 'page' : null">
                        Heroes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-2" routerLink="/merch" [class.active]="isMerchActive()" [attr.aria-current]="isMerchActive() ? 'page' : null">
                        Merch
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-2" href="https://secure.cbf.org/site/Donation2" target="_self">
                        Donate
                    </a>
                </li>
            </ul>
        </div>
        <div class="dropdown ms-auto align-self-center">
            <button type="button" class="theme-toggler d-block text-white text-decoration-none dropdown-toggle" id="themeToggler" data-bs-toggle="dropdown" aria-expanded="false" [attr.aria-label]="'Color theme: ' + themeSettingLabel()">
                <i class="bi" [ngClass]="theme.currentTheme() === 'light' ? 'bi-brightness-high' : theme.currentTheme() === 'dark' ? 'bi-moon-stars' : 'bi-moon-stars-fill'" aria-hidden="true"></i>
            </button>
            <ul class="dropdown-menu themeToggleMenu paper text-small" aria-labelledby="themeToggler" data-popper-placement="bottom-end">
                <li>
                    <button type="button" class="dropdown-item dropdown-highlight cursor-pointer" (click)="theme.setTheme('auto')" [attr.aria-current]="theme.currentThemeSetting() === 'auto' ? 'true' : null">
                        <i [ngClass]="theme.currentThemeSetting() === 'auto' ? 'bi bi-check2-circle' : 'd-none'" aria-hidden="true"></i>&nbsp;
                        Automatic
                    </button>
                </li>
                <li>
                    <hr class="dropdown-divider">
                </li>
                <li>
                    <button type="button" class="dropdown-item dropdown-highlight-light cursor-pointer" (click)="theme.setTheme('light')" [attr.aria-current]="theme.currentThemeSetting() === 'light' ? 'true' : null">
                        <i [ngClass]="theme.currentThemeSetting() === 'light' ? 'bi bi-check2-circle' : 'd-none'" aria-hidden="true"></i>&nbsp;
                        Light
                    </button>
                </li>
                <li>
                    <button type="button" class="dropdown-item dropdown-highlight-dark cursor-pointer" (click)="theme.setTheme('dark')" [attr.aria-current]="theme.currentThemeSetting() === 'dark' ? 'true' : null">
                        <i [ngClass]="theme.currentThemeSetting() === 'dark' ? 'bi bi-check2-circle' : 'd-none'" aria-hidden="true"></i>&nbsp;
                        Dark
                    </button>
                </li>
                <li>
                    <button type="button" class="dropdown-item dropdown-highlight-black cursor-pointer" (click)="theme.setTheme('black')" [attr.aria-current]="theme.currentThemeSetting() === 'black' ? 'true' : null">
                        <i [ngClass]="theme.currentThemeSetting() === 'black' ? 'bi bi-check2-circle' : 'd-none'" aria-hidden="true"></i>&nbsp;
                        Black
                    </button>
                </li>
                <li>
                    <hr class="dropdown-divider">
                </li>
                <li>
                    <button type="button" class="dropdown-item dropdown-highlight cursor-pointer" (click)="theme.toggleReducedMotion()" [attr.aria-pressed]="theme.reducedMotion()">
                        <i [ngClass]="theme.reducedMotion() ? 'bi bi-check2-circle' : 'd-none'" aria-hidden="true"></i>&nbsp;
                        Reduce motion
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>
